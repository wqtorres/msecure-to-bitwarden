[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msecure-to-bitwarden"
dynamic = ["version"]
description = "Convert mSecure 6/7 CSV exports to unencrypted Bitwarden JSON files."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wilson Torres", email = "wqtorres@gmail.com" }]
keywords = ["msecure", "bitwarden", "password-manager", "converter", "csv", "json", "migration", "keepassxc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]
# The tool only uses the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wqtorres/msecure-to-bitwarden"
Issues = "https://github.com/wqtorres/msecure-to-bitwarden/issues"
Changelog = "https://github.com/wqtorres/msecure-to-bitwarden/blob/main/CHANGELOG.md"

[project.scripts]
msecure-to-bitwarden = "msecure_to_bitwarden.cli:main"

[tool.setuptools.dynamic]
version = { attr = "msecure_to_bitwarden.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
